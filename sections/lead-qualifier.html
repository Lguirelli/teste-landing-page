<section class="section" id="lead">
  <div class="container grid-2">
    <div>
      <span class="section-kicker" data-copy="lead.kicker">Qualificação</span>
      <h2 class="section-title" data-copy="lead.title">Lorem ipsum dolor sit amet.</h2>
      <p class="section-lead" data-copy="lead.lead">Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed posuere consectetur est at lobortis.</p>
    </div>

    <form class="card" action="#" method="post">
      <div class="form-grid">
        <div class="form-field">
          <label for="name" data-copy="lead.nameLabel">Lorem</label>
          <input id="name" name="name" type="text" placeholder="Lorem ipsum" data-copy="lead.namePlaceholder" data-copy-target="placeholder" />
        </div>
        <div class="form-field">
          <label for="email" data-copy="lead.emailLabel">Lorem</label>
          <input id="email" name="email" type="email" placeholder="lorem@email.com" />
        </div>
        <div class="form-field">
          <label for="select" data-copy="lead.selectLabel">Lorem</label>
          <select id="select" name="select">
            <option>Lorem ipsum</option>
            <option>Dolor sit</option>
            <option>Amet consectetur</option>
          </select>
        </div>
        <div class="form-field">
          <label for="phone" data-copy="lead.phoneLabel">Lorem</label>
          <input id="phone" name="phone" type="tel" placeholder="(00) 00000-0000" />
        </div>
        <div class="form-field full">
          <label for="message" data-copy="lead.messageLabel">Lorem</label>
          <textarea id="message" name="message" rows="4" placeholder="Lorem ipsum dolor sit amet" data-copy="lead.messagePlaceholder" data-copy-target="placeholder"></textarea>
        </div>
      </div>
      <button class="btn btn-accent" type="submit" style="width: 100%; margin-top: 18px;" data-copy="lead.button">Lorem ipsum</button>
      <p class="microcopy" data-copy="lead.microcopy">Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
    </form>
  </div>
</section>
